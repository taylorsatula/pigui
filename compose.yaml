# picloud on one machine: the app, and Tailscale serving it over HTTPS to your tailnet only.
#
#   cp .env.example .env                    # fill it in
#   docker compose build
#   docker compose run --rm picloud pi      # once: /login, then /model, then /quit
#   docker compose up -d
#
# README.md, "Run with Docker", has the details.
name: picloud

# Docker keeps container logs without limit by default, and picloud logs every request; three 10 MB files each is
# plenty and keeps a small disk for workspaces.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: ${PICLOUD_TS_HOSTNAME:-picloud}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # The key is only for joining; afterwards the state volume keeps the machine signed in.
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - tailscale:/var/lib/tailscale
      - ./deploy/docker/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    # Only what a VPN interface needs (configuring it, and its firewall rules), instead of Docker's default set, and
    # a read-only system that writes only its state, its socket and lock files.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
    pids_limit: 128
    logging: *logging
    restart: unless-stopped

  picloud:
    build:
      context: .
      args:
        PICLOUD_SPEECH: ${PICLOUD_SPEECH:-on}
        PICLOUD_MEMORY_LOCAL: ${PICLOUD_MEMORY_LOCAL:-off}
    image: picloud:local
    # picloud listens on the loopback of the Tailscale container's network, so `tailscale serve` is the only way in.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      GH_TOKEN: ${GH_TOKEN:?Set GH_TOKEN in .env; see .env.example}
      PICLOUD_AGENT_GH_TOKEN: ${AGENT_GH_TOKEN:?Set AGENT_GH_TOKEN in .env; see .env.example}
      PICLOUD_SANDBOX: ${PICLOUD_SANDBOX:-on}
      PICLOUD_PUSH_SUBJECT: ${PICLOUD_PUSH_SUBJECT:-mailto:picloud@localhost}
      PICLOUD_ALLOWED_LOGINS: ${PICLOUD_ALLOWED_LOGINS:-}
      PICLOUD_SPEND_CAP: ${PICLOUD_SPEND_CAP:-}
      PICLOUD_COMPACTION_MODEL: ${PICLOUD_COMPACTION_MODEL:-}
      PICLOUD_MEMORY_PROVIDER: ${PICLOUD_MEMORY_PROVIDER:-lunaroute}
      PICLOUD_MEMORY_EMBED_MODEL: ${PICLOUD_MEMORY_EMBED_MODEL:-emb-qwen3}
      PICLOUD_MEMORY_EMBED_URL: ${PICLOUD_MEMORY_EMBED_URL:-}
    volumes:
      - data:/data
      - home:/home/picloud
    # Least privilege: picloud and the agent's commands run as an unprivileged user with no capabilities, cannot gain
    # privileges, and cannot change the system. They write only the two volumes and a scratch /tmp, which builds and
    # tests may run programs from. A process limit stops a runaway test from exhausting the machine. Each agent command
    # is further confined, by the host kernel's Landlock, to its own session's directories.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:exec,nosuid,nodev,size=512m
    pids_limit: 1024
    # An init process reaps whatever the agent's commands leave behind, and passes on the stop signal so picloud
    # can shut down cleanly within the grace period.
    init: true
    stop_grace_period: 60s
    logging: *logging
    restart: unless-stopped

volumes:
  tailscale:
  data:
  home:
